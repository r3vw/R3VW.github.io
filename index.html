<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>썸네일 제작기</title>

<style>

/* =========================
   Aggravo
========================= */

@font-face {
    font-family: 'Aggravo';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2108@1.1/SBAggroL.woff') format('woff');
    font-weight: 300;
    font-display: swap;
}

@font-face {
    font-family: 'Aggravo';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2108@1.1/SBAggroM.woff') format('woff');
    font-weight: 500;
    font-display: swap;
}

@font-face {
    font-family: 'Aggravo';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2108@1.1/SBAggroB.woff') format('woff');
    font-weight: 700;
    font-display: swap;
}


/* =========================
   기본
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #181818;
    color: white;
}

.container {
    display: flex;
    min-height: 100vh;
}


/* =========================
   사이드바
========================= */

.sidebar {
    width: 330px;
    padding: 25px;
    background: #242424;
    border-right: 1px solid #3a3a3a;
    overflow-y: auto;
    flex-shrink: 0;
}

.sidebar h1 {
    font-size: 23px;
    margin: 0 0 25px;
}

.section {
    margin-bottom: 24px;
}

.section-title {
    font-size: 14px;
    font-weight: bold;
    color: #aaa;
    margin-bottom: 10px;
}

input,
select,
button {
    font-family: inherit;
}


/* =========================
   입력
========================= */

input[type="text"],
select {
    width: 100%;
    padding: 11px;
    border: 1px solid #444;
    border-radius: 7px;
    background: #333;
    color: white;
    outline: none;
}

input[type="range"] {
    width: 100%;
    cursor: pointer;
}

.range-value {
    display: flex;
    justify-content: space-between;
    color: #aaa;
    font-size: 12px;
}


/* =========================
   색상
========================= */

input[type="color"] {
    width: 100%;
    height: 42px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
}


/* =========================
   스타일 버튼
========================= */

.buttons {
    display: flex;
    gap: 7px;
}

.style-button {
    flex: 1;
    height: 42px;
    border: 1px solid #444;
    border-radius: 7px;
    background: #333;
    color: white;
    cursor: pointer;
    font-size: 17px;
}

.style-button:hover {
    background: #444;
}

.style-button.active {
    background: white;
    color: #111;
}


/* =========================
   파일 업로드
========================= */

.upload {
    width: 100%;
    padding: 12px;
    background: #333;
    border: 1px solid #444;
    border-radius: 7px;
    cursor: pointer;
    color: white;
}


/* =========================
   저장 버튼
========================= */

.download {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #ff0033;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.download:hover {
    background: #e6002d;
}


/* =========================
   미리보기
========================= */

.preview-area {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px;
    background:
        radial-gradient(
            circle at center,
            #303030 0%,
            #151515 70%
        );
    min-width: 0;
}

.preview-wrapper {
    width: min(90vw, 1280px);
}

.preview-title {
    text-align: center;
    color: #aaa;
    margin-bottom: 15px;
    font-size: 14px;
}

canvas {
    width: 100%;
    height: auto;
    display: block;
    background: white;
    box-shadow: 0 15px 50px rgba(0,0,0,0.5);
}


/* =========================
   저장 옵션
========================= */

.format-buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
}

.format-button {
    padding: 10px 5px;
    background: #333;
    color: white;
    border: 1px solid #444;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.format-button:hover {
    background: #444;
}

.format-button.active {
    background: white;
    color: #111;
}


/* =========================
   모바일
========================= */

@media (max-width: 800px) {

    .container {
        flex-direction: column;
    }

    .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid #3a3a3a;
    }

    .preview-area {
        padding: 20px;
    }

}

</style>
</head>


<body>

<div class="container">


<!-- =========================
     설정
========================= -->

<aside class="sidebar">

    <h1>🎨 유튜브 썸네일 제작기</h1>


    <!-- 날짜 -->

    <div class="section">

        <div class="section-title">
            날짜
        </div>

        <input
            type="text"
            id="dateInput"
            placeholder="2026.08.19."
        >

    </div>


    <!-- 폰트 -->

    <div class="section">

        <div class="section-title">
            폰트
        </div>

        <select id="fontSelect">

            <option value="Aggravo">
                어그로체 (Aggravo)
            </option>

            <option value="Arial">
                Arial
            </option>

            <option value="Arial Black">
                Arial Black
            </option>

            <option value="Impact">
                Impact
            </option>

            <option value="Georgia">
                Georgia
            </option>

            <option value="Times New Roman">
                Times New Roman
            </option>

            <option value="Verdana">
                Verdana
            </option>

            <option value="Tahoma">
                Tahoma
            </option>

            <option value="Trebuchet MS">
                Trebuchet MS
            </option>

            <option value="Courier New">
                Courier New
            </option>

            <option value="sans-serif">
                Sans Serif
            </option>

            <option value="serif">
                Serif
            </option>

        </select>

    </div>


    <!-- 굵기 슬라이더 -->

    <div class="section">

        <div class="section-title">
            폰트 굵기
        </div>

        <input
            type="range"
            id="fontWeight"
            min="300"
            max="700"
            step="1"
            value="500"
        >

        <div class="range-value">

            <span>300</span>

            <span id="fontWeightValue">
                500
            </span>

            <span>700</span>

        </div>

    </div>


    <!-- 글자 크기 -->

    <div class="section">

        <div class="section-title">
            글자 크기
        </div>

        <input
            type="range"
            id="fontSize"
            min="40"
            max="500"
            value="180"
        >

        <div class="range-value">

            <span>40px</span>

            <span id="fontSizeValue">
                180px
            </span>

            <span>500px</span>

        </div>

    </div>


    <!-- 스타일 -->

    <div class="section">

        <div class="section-title">
            글자 스타일
        </div>

        <div class="buttons">

            <button
                type="button"
                class="style-button"
                id="italicButton"
            >
                <i>I</i>
            </button>

            <button
                type="button"
                class="style-button"
                id="underlineButton"
            >
                <u>U</u>
            </button>

        </div>

    </div>


    <!-- 글자색 -->

    <div class="section">

        <div class="section-title">
            글자 색상
        </div>

        <input
            type="color"
            id="textColor"
            value="#ffffff"
        >

    </div>


    <!-- 배경색 -->

    <div class="section">

        <div class="section-title">
            배경 색상
        </div>

        <input
            type="color"
            id="backgroundColor"
            value="#111111"
        >

    </div>


    <!-- 배경 이미지 -->

    <div class="section">

        <div class="section-title">
            배경 이미지
        </div>

        <input
            class="upload"
            type="file"
            id="backgroundImage"
            accept="image/*"
        >

    </div>


    <!-- 저장 형식 -->

    <div class="section">

        <div class="section-title">
            저장 형식
        </div>

        <div class="format-buttons">

            <button
                type="button"
                class="format-button active"
                data-format="png"
            >
                PNG
            </button>

            <button
                type="button"
                class="format-button"
                data-format="jpeg"
            >
                JPG
            </button>

            <button
                type="button"
                class="format-button"
                data-format="webp"
            >
                WEBP
            </button>

        </div>

    </div>


    <!-- 품질 -->

    <div class="section">

        <div class="section-title">
            이미지 품질
        </div>

        <input
            type="range"
            id="quality"
            min="10"
            max="100"
            value="90"
        >

        <div class="range-value">

            <span>10%</span>

            <span id="qualityValue">
                90%
            </span>

            <span>100%</span>

        </div>

    </div>


    <!-- 저장 -->

    <div class="section">

        <button
            type="button"
            class="download"
            id="downloadButton"
        >
            ⬇️ 이미지 저장
        </button>

    </div>

</aside>



<!-- =========================
     미리보기
========================= -->

<main class="preview-area">

    <div class="preview-wrapper">

        <div class="preview-title">
            썸네일 미리보기 · 1280 × 720
        </div>

        <canvas
            id="canvas"
            width="1280"
            height="720"
        ></canvas>

    </div>

</main>

</div>



<script>

/* =========================
   DOM
========================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const dateInput =
    document.getElementById("dateInput");

const fontSelect =
    document.getElementById("fontSelect");

const fontWeight =
    document.getElementById("fontWeight");

const fontWeightValue =
    document.getElementById("fontWeightValue");

const fontSize =
    document.getElementById("fontSize");

const fontSizeValue =
    document.getElementById("fontSizeValue");

const textColor =
    document.getElementById("textColor");

const backgroundColor =
    document.getElementById("backgroundColor");

const backgroundImage =
    document.getElementById("backgroundImage");

const quality =
    document.getElementById("quality");

const qualityValue =
    document.getElementById("qualityValue");

const downloadButton =
    document.getElementById("downloadButton");


/* =========================
   상태
========================= */

let image = null;

let selectedFormat = "png";

let styles = {
    italic: false,
    underline: false
};


/* =========================
   오늘 날짜
========================= */

function getToday() {

    const today = new Date();

    const year =
        today.getFullYear();

    const month =
        String(
            today.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            today.getDate()
        ).padStart(2, "0");

    return `${year}.${month}.${day}.`;
}

dateInput.value = getToday();


/* =========================
   이벤트
========================= */

dateInput.addEventListener(
    "input",
    draw
);


fontSelect.addEventListener(
    "change",
    draw
);


fontWeight.addEventListener(
    "input",
    function() {

        fontWeightValue.textContent =
            fontWeight.value;

        draw();

    }
);


fontSize.addEventListener(
    "input",
    function() {

        fontSizeValue.textContent =
            fontSize.value + "px";

        draw();

    }
);


textColor.addEventListener(
    "input",
    draw
);


backgroundColor.addEventListener(
    "input",
    draw
);


quality.addEventListener(
    "input",
    function() {

        qualityValue.textContent =
            quality.value + "%";

    }
);


/* =========================
   스타일 버튼
========================= */

document
    .getElementById("italicButton")
    .addEventListener(
        "click",
        function() {

            styles.italic =
                !styles.italic;

            this.classList.toggle(
                "active",
                styles.italic
            );

            draw();

        }
    );


document
    .getElementById("underlineButton")
    .addEventListener(
        "click",
        function() {

            styles.underline =
                !styles.underline;

            this.classList.toggle(
                "active",
                styles.underline
            );

            draw();

        }
    );


/* =========================
   배경 이미지
========================= */

backgroundImage.addEventListener(
    "change",
    function(event) {

        const file =
            event.target.files[0];

        if (!file) {
            return;
        }

        const reader =
            new FileReader();

        reader.onload =
            function(e) {

                image =
                    new Image();

                image.onload =
                    function() {

                        draw();

                    };

                image.src =
                    e.target.result;

            };

        reader.readAsDataURL(file);

    }
);


/* =========================
   배경 이미지 그리기
========================= */

function drawBackgroundImage() {

    if (!image) {
        return;
    }

    const canvasRatio =
        canvas.width /
        canvas.height;

    const imageRatio =
        image.width /
        image.height;

    let width;
    let height;
    let x;
    let y;


    if (imageRatio > canvasRatio) {

        height =
            canvas.height;

        width =
            height * imageRatio;

        x =
            (canvas.width - width) / 2;

        y = 0;

    } else {

        width =
            canvas.width;

        height =
            width / imageRatio;

        x = 0;

        y =
            (canvas.height - height) / 2;

    }


    ctx.drawImage(
        image,
        x,
        y,
        width,
        height
    );

}


/* =========================
   폰트 로딩
========================= */

async function waitForFont() {

    try {

        await document.fonts.load(
            `${fontWeight.value} ${fontSize.value}px "${fontSelect.value}"`
        );

    } catch (error) {

        console.log(
            "폰트 로딩 오류:",
            error
        );

    }

}


/* =========================
   캔버스 렌더링
========================= */

async function draw() {

    /* 배경 */

    ctx.fillStyle =
        backgroundColor.value;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* 이미지 */

    drawBackgroundImage();


    /* 폰트 */

    await waitForFont();


    let fontStyle = "";


    if (styles.italic) {

        fontStyle +=
            "italic ";

    }


    fontStyle +=
        fontWeight.value +
        " " +
        fontSize.value +
        "px " +
        `"${fontSelect.value}"`;


    ctx.font =
        fontStyle;


    /* 글자 */

    ctx.fillStyle =
        textColor.value;

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    const text =
        dateInput.value;


    const x =
        canvas.width / 2;

    const y =
        canvas.height / 2;


    ctx.fillText(
        text,
        x,
        y
    );


    /* 밑줄 */

    if (styles.underline) {

        const metrics =
            ctx.measureText(text);

        const underlineWidth =
            metrics.width;

        const underlineY =
            y +
            Number(fontSize.value) * 0.38;


        ctx.beginPath();


        ctx.lineWidth =
            Math.max(
                2,
                Number(fontSize.value) / 20
            );


        ctx.strokeStyle =
            textColor.value;


        ctx.moveTo(
            x - underlineWidth / 2,
            underlineY
        );


        ctx.lineTo(
            x + underlineWidth / 2,
            underlineY
        );


        ctx.stroke();

    }

}


/* =========================
   저장 형식 선택
========================= */

document
    .querySelectorAll(".format-button")
    .forEach(function(button) {

        button.addEventListener(
            "click",
            function() {

                document
                    .querySelectorAll(
                        ".format-button"
                    )
                    .forEach(function(btn) {

                        btn.classList.remove(
                            "active"
                        );

                    });


                this.classList.add(
                    "active"
                );


                selectedFormat =
                    this.dataset.format;

            }
        );

    });


/* =========================
   이미지 저장
========================= */

function downloadThumbnail() {

    let mimeType;
    let extension;


    if (selectedFormat === "png") {

        mimeType =
            "image/png";

        extension =
            "png";

    }

    else if (
        selectedFormat === "jpeg"
    ) {

        mimeType =
            "image/jpeg";

        extension =
            "jpg";

    }

    else {

        mimeType =
            "image/webp";

        extension =
            "webp";

    }


    const imageQuality =
        Number(
            quality.value
        ) / 100;


    canvas.toBlob(
        function(blob) {

            if (!blob) {

                alert(
                    "이미지를 저장하지 못했습니다."
                );

                return;

            }


            const url =
                URL.createObjectURL(blob);


            const link =
                document.createElement("a");


            link.href =
                url;


            link.download =
                `youtube-thumbnail-1280x720.${extension}`;


            document.body.appendChild(
                link
            );


            link.click();


            document.body.removeChild(
                link
            );


            setTimeout(
                function() {

                    URL.revokeObjectURL(
                        url
                    );

                },
                1000
            );


        },
        mimeType,
        imageQuality
    );

}


downloadButton.addEventListener(
    "click",
    downloadThumbnail
);


/* =========================
   초기값
========================= */

fontWeightValue.textContent =
    fontWeight.value;

fontSizeValue.textContent =
    fontSize.value + "px";

qualityValue.textContent =
    quality.value + "%";


/* =========================
   시작
========================= */

draw();

</script>

</body>
</html>
